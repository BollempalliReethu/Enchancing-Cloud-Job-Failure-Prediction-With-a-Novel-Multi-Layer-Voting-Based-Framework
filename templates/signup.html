<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/owl.carousel.min.css">
    <link rel="stylesheet" href="../static/css/owl.theme.default.min.css">
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../static/css/style.css">

    <title>Sign Up - Cloud Job Failure Prediction</title>
</head>

<body data-bs-spy="scroll" data-bs-target=".navbar" data-bs-offset="70">


    <!-- SIGNUP SECTION -->
    <section id="signup-section" class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-6">
                    <div class="signup-container">
                        <!-- Header -->
                        <div class="signup-header text-center mb-5">
                            <h2 class="signup-title">Create Account</h2>
                            <p class="signup-subtitle">Join our cloud job failure prediction platform</p>
                        </div>

                        <!-- Signup Form -->
                        <form class="signup-form" method="POST" action="/signup">
                            {% if message %}
                            <div class="alert alert-danger" role="alert">
                                <i class='bx bx-error-circle'></i>
                                {{ message }}
                            </div>
                            {% endif %}

                            <div class="row g-4">
                                <!-- Username -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="user" class="form-label">Username</label>
                                        <div class="input-wrapper">
                                            <input type="text" class="form-control" id="user" name="user" placeholder="Enter username" required>
                                            <div class="form-icon">
                                                <i class='bx bx-user'></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Full Name -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="name" class="form-label">Full Name</label>
                                        <div class="input-wrapper">
                                            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
                                            <div class="form-icon">
                                                <i class='bx bx-user-circle'></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Email -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="email" class="form-label">Email Address</label>
                                        <div class="input-wrapper">
                                            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                                            <div class="form-icon">
                                                <i class='bx bx-envelope'></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Mobile -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="mobile" class="form-label">Mobile Number</label>
                                        <div class="input-wrapper">
                                            <input type="tel" class="form-control" id="mobile" name="mobile" placeholder="Enter mobile number" required>
                                            <div class="form-icon">
                                                <i class='bx bx-phone'></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Password -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="password" class="form-label">Password</label>
                                        <div class="input-wrapper">
                                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                                            <div class="form-icon">
                                                <i class='bx bx-lock'></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="confirm_password" class="form-label">Confirm Password</label>
                                        <div class="input-wrapper">
                                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
                                            <div class="form-icon">
                                                <i class='bx bx-lock-alt'></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>


                            <!-- Submit Button -->
                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-signup">
                                    <span class="btn-text">Create Account</span>
                                    <span class="btn-icon">
                                        <i class='bx bx-user-plus'></i>
                                    </span>
                                </button>
                            </div>

                            <!-- Login Link -->
                            <div class="text-center mt-4">
                                <p class="login-link">
                                    Already have an account? 
                                    <a href="/login" class="login-text">Sign In here</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="../static/js/jquery.min.js"></script>
    <script src="../static/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/owl.carousel.min.js"></script>
    <script src="../static/js/app.js"></script>
    
    <!-- Signup Enhancement Script -->
    <script>
        $(document).ready(function() {
            // Form validation and enhancement
            const form = $('.signup-form');
            const submitBtn = $('.btn-signup');
            
            // Add floating label effect
            $('.form-control').on('focus blur', function() {
                const $this = $(this);
                const $label = $this.closest('.form-group').find('.form-label');
                
                if ($this.is(':focus') || $this.val() !== '') {
                    $label.addClass('active');
                } else {
                    $label.removeClass('active');
                }
            });
            
            // Password confirmation validation
            $('#confirm_password').on('input', function() {
                const password = $('#password').val();
                const confirmPassword = $(this).val();
                
                if (confirmPassword !== '' && password !== confirmPassword) {
                    $(this).addClass('is-invalid');
                    $(this).removeClass('is-valid');
                } else if (confirmPassword !== '' && password === confirmPassword) {
                    $(this).addClass('is-valid');
                    $(this).removeClass('is-invalid');
                } else {
                    $(this).removeClass('is-valid is-invalid');
                }
            });
            
            // Real-time validation
            $('.form-control').on('input', function() {
                const $this = $(this);
                const value = $this.val();
                
                // Remove previous validation classes
                $this.removeClass('is-valid is-invalid');
                
                if (value.length > 0) {
                    if ($this.attr('type') === 'email') {
                        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if (emailRegex.test(value)) {
                            $this.addClass('is-valid');
                        } else {
                            $this.addClass('is-invalid');
                        }
                    } else if ($this.attr('type') === 'tel') {
                        const phoneRegex = /^[\+]?[1-9][\d]{0,15}$/;
                        if (phoneRegex.test(value)) {
                            $this.addClass('is-valid');
                        } else {
                            $this.addClass('is-invalid');
                        }
                    } else if (value.length >= 3) {
                        $this.addClass('is-valid');
                    }
                }
            });
            
            // Form submission with loading state
            form.on('submit', function(e) {
                const password = $('#password').val();
                const confirmPassword = $('#confirm_password').val();
                
                if (password !== confirmPassword) {
                    e.preventDefault();
                    alert('Passwords do not match!');
                    return false;
                }
                
                // Add loading state
                submitBtn.addClass('form-loading');
                submitBtn.find('.btn-text').text('Creating Account...');
                submitBtn.find('.btn-icon').html('<i class="bx bx-loader-alt bx-spin"></i>');
            });
        });
    </script>
</body>

</html>
