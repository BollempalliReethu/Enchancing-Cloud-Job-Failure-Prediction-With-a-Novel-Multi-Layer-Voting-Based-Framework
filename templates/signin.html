<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/owl.carousel.min.css">
    <link rel="stylesheet" href="../static/css/owl.theme.default.min.css">
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../static/css/style.css">

    <title>Sign In - Cloud Job Failure Prediction</title>
</head>

<body data-bs-spy="scroll" data-bs-target=".navbar" data-bs-offset="70">

    <!-- SIGNIN SECTION -->
    <section id="signin-section" class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-xl-5">
                    <div class="signin-container">
                        <!-- Header -->
                        <div class="signin-header text-center mb-5">
                            <h2 class="signin-title">Welcome Back</h2>
                            <p class="signin-subtitle">Sign in to your account to continue</p>
                        </div>

                        <!-- Signin Form -->
                        <form class="signin-form" method="POST" action="/signin">
                            {% if message %}
                            <div class="alert alert-danger" role="alert">
                                <i class='bx bx-error-circle'></i>
                                {{ message }}
                            </div>
                            {% endif %}

                            <!-- Username -->
                            <div class="form-group">
                                <label for="user" class="form-label">Username</label>
                                <div class="input-wrapper">
                                    <input type="text" class="form-control" id="user" name="user" placeholder="Enter your username" required>
                                    <div class="form-icon">
                                        <i class='bx bx-user'></i>
                                    </div>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="form-group">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-wrapper">
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                                    <div class="form-icon">
                                        <i class='bx bx-lock'></i>
                                    </div>
                                </div>
                            </div>


                            <!-- Submit Button -->
                            <div class="text-center">
                                <button type="submit" class="btn btn-signin">
                                    <span class="btn-text">Sign In</span>
                                    <span class="btn-icon">
                                        <i class='bx bx-log-in'></i>
                                    </span>
                                </button>
                            </div>

                            <!-- Signup Link -->
                            <div class="text-center mt-4">
                                <p class="signup-link">
                                    Don't have an account? 
                                    <a href="/signup" class="signup-text">Sign Up here</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../static/js/jquery.min.js"></script>
    <script src="../static/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/owl.carousel.min.js"></script>
    <script src="../static/js/app.js"></script>
    
    <!-- Signin Enhancement Script -->
    <script>
        $(document).ready(function() {
            // Form validation and enhancement
            const form = $('.signin-form');
            const submitBtn = $('.btn-signin');
            
            // Add floating label effect
            $('.form-control').on('focus blur', function() {
                const $this = $(this);
                const $label = $this.closest('.form-group').find('.form-label');
                
                if ($this.is(':focus') || $this.val() !== '') {
                    $label.addClass('active');
                } else {
                    $label.removeClass('active');
                }
            });
            
            // Real-time validation
            $('.form-control').on('input', function() {
                const $this = $(this);
                const value = $this.val();
                
                // Remove previous validation classes
                $this.removeClass('is-valid is-invalid');
                
                if (value.length > 0) {
                    if (value.length >= 3) {
                        $this.addClass('is-valid');
                    }
                }
            });
            
            // Form submission with loading state
            form.on('submit', function(e) {
                // Add loading state
                submitBtn.addClass('form-loading');
                submitBtn.find('.btn-text').text('Signing In...');
                submitBtn.find('.btn-icon').html('<i class="bx bx-loader-alt bx-spin"></i>');
            });
        });
    </script>
</body>

</html>
